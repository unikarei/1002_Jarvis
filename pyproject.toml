[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "prj-jarvis"
version = "0.1.0"
description = "Personal AI secretary and MiTiR integration client"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "PyYAML>=6,<7",
]

[project.scripts]
jarvis-mitir-verify = "jarvis.integrations.mitir.verify:main"
jarvis-daily-summary = "jarvis.integrations.mitir.daily_summary_cli:main"
jarvis-chat = "jarvis.chat_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
